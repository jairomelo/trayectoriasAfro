# Development override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Live reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml watch

services:
  postgres:
    ports:
      - "5432:5432"  # Expose for local DB access

  web:
    build:
      context: .
      dockerfile: ./mstdb_manager/Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=mdb.settings
      - PYTHONUNBUFFERED=1
    volumes:
      # Bind-mount for instant file sync — Django runserver handles reloads
      - ./mstdb_manager:/app
      - ./mstdb_theme/build:/app/staticfiles/frontend
      - ./deposit:/app/deposit
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    develop:
      watch:
        # Rebuild image when dependencies change
        - action: rebuild
          path: ./mstdb_manager/pyproject.toml
        - action: rebuild
          path: ./mstdb_manager/uv.lock

  frontend:
    ports:
      - "3000:80"
    develop:
      watch:
        # Any source, config, or dependency change requires a fresh npm build
        - action: rebuild
          path: ./mstdb_theme/src
        - action: rebuild
          path: ./mstdb_theme/package.json
        - action: rebuild
          path: ./mstdb_theme/svelte.config.js
        - action: rebuild
          path: ./mstdb_theme/vite.config.js
